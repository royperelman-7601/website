# Render Blueprint: static site, no build step, deploys on every push to main.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: royperelman
    branch: main
    buildCommand: "true"        # no build step; Render requires a build command
    staticPublishPath: ./
    autoDeployTrigger: commit
    headers:
      # Security headers (real HTTP headers; stronger than the <meta> CSP, and adds frame-ancestors)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/three@0.160.0/build/; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # Caching: file names are not hashed, so keep CSS/JS short; images can live longer.
      # (HTML uses Render's default; the CDN cache is purged on every deploy.)
      - path: /css/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /js/**/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /js/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /photos/*
        name: Cache-Control
        value: public, max-age=86400
